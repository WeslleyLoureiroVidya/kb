name: Sincronizar Base de Conhecimento Movidesk

on:
  schedule:
    # Roda automaticamente todo dia às 06:00 da manhã (UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser!

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script de sincronização
        env:
          MOVIDESK_TOKEN: ${{ secrets.MOVIDESK_TOKEN }}
        run: python scripts/sincronizar_kb.py

      - name: Atualizar arquivo no repositório GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add artigos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática da base de conhecimento [skip ci]" && git push)
